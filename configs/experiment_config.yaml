# Central configuration for Phase 1 and Phase 2.
# Paths are relative to the project root. Do not hardcode absolute paths.

seed: 42
test_size: 0.2
positive_class: 1
positive_class_name: phishing
negative_class_name: legitimate
domain_split_seed_search: 20

paths:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  metadata_dir: data/metadata
  models_dir: models
  results_dir: results
  reports_dir: reports
  logs_dir: logs

phiusiil:
  name: phiusiil
  zip_url: https://archive.ics.uci.edu/static/public/967/phiusiil+phishing+url+dataset.zip
  uci_page: https://archive.ics.uci.edu/dataset/967/phiusiil+phishing+url+dataset
  uci_api: https://archive.ics.uci.edu/api/dataset?id=967
  doi: https://doi.org/10.1016/j.cose.2023.103545
  sample_size: 70000
  # Confirmed from UCI abstract counts: 134850 legitimate (label 1), 100945 phishing (label 0).
  raw_phishing_label: 0
  raw_legitimate_label: 1
  expected_raw_counts:
    "0": 100945
    "1": 134850
  exclude_from_model:
    - FILENAME
    - URL
    - Domain
    - Title
    - URLSimilarityIndex
    - label
    - raw_label
    - registrable_domain
    - split_random
    - split_domain
  categorical_columns:
    - TLD
  one_hot_min_frequency: 100

phreshphish:
  name: phreshphish
  repo_id: phreshphish/phreshphish
  hf_page: https://huggingface.co/datasets/phreshphish/phreshphish
  paper_url: https://arxiv.org/abs/2507.10854
  columns:
    - sha256
    - url
    - label
    - date
  sample_size: 40000
  # Do not read or store the html column.
  raw_phishing_label: phish
  raw_legitimate_label: benign

models:
  logistic_regression:
    max_iter: 1000
    solver: lbfgs
    class_weight: balanced
  random_forest:
    n_estimators: 100
    max_depth: 18
    min_samples_leaf: 2
    max_features: sqrt
    n_jobs: 2
    class_weight: null
  xgboost:
    n_estimators: 120
    max_depth: 6
    learning_rate: 0.1
    subsample: 0.9
    colsample_bytree: 0.9
    reg_lambda: 1.0
    min_child_weight: 2
    n_jobs: 2
    tree_method: hist
    objective: binary:logistic
    eval_metric: logloss
  sgd_classifier:
    loss: log_loss
    penalty: l2
    alpha: 0.0001
    max_iter: 40
    tol: 0.0001
    class_weight: balanced

url_features:
  suspicious_keywords:
    - login
    - signin
    - sign-in
    - verify
    - verification
    - account
    - update
    - secure
    - banking
    - confirm
    - password
    - wallet
    - paypal
    - invoice
    - payment
    - suspend
    - credential
  shorteners:
    - bit.ly
    - tinyurl.com
    - goo.gl
    - t.co
    - ow.ly
    - is.gd
    - buff.ly
    - adf.ly
    - bit.do
    - cutt.ly
    - tiny.cc
    - rb.gy
    - shorturl.at
    - tiny.one
    - rebrand.ly
